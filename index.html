    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Theme init: apply dark class before React renders to prevent flash -->
    <script>
      (function () {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    
    <!-- Meta tags for SEO and social sharing -->
    <meta name="description" content="Adam Olser — Senior Frontend Engineer specialising in React, TypeScript, and Next.js. 7+ years building authentication and payment systems for millions of users." />
    <meta name="keywords" content="Adam Olser, Frontend Engineer, React, TypeScript, Next.js, GraphQL, Authentication, Payment Systems" />
    <meta name="author" content="Adam Olser" />

    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Adam Olser — Senior Frontend Engineer" />
