<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://adam-olser.github.io/" />
    <meta name="theme-color" content="#121317" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: preload as style, apply on load; system fonts show meanwhile -->
    <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_tree,alternate_email,check_circle,close,code,dark_mode,deployed_code,draw,light_mode,menu,monitoring,science,share&display=block" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" /></noscript>
    <!-- Theme init: apply dark class before React renders to prevent flash -->
    <script>
      (function () {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    
    <!-- Meta tags for SEO and social sharing -->
    <meta name="description" content="Adam Olšer, software engineer in Barcelona working with React, TypeScript, Next.js and GraphQL. I build software that people use every day and rarely have to think about." />
    <meta name="keywords" content="Adam Olšer, Software Engineer, Frontend Engineer, React, TypeScript, Next.js, GraphQL" />
    <meta name="author" content="Adam Olser" />

    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Adam Olšer, Software Engineer" />
    <meta property="og:description" content="React, TypeScript and Next.js engineer in Barcelona. I build software that people use every day and rarely have to think about." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adam-olser.github.io/" />
    <meta property="og:image" content="https://adam-olser.github.io/previews/og.jpg" />
    <meta name="twitter:image" content="https://adam-olser.github.io/previews/og.jpg" />

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adam Olšer, Software Engineer" />
    <meta name="twitter:description" content="React, TypeScript and Next.js engineer in Barcelona. I build software that people use every day and rarely have to think about." />

    </script>

    <title>Adam Olšer, Software Engineer</title>
